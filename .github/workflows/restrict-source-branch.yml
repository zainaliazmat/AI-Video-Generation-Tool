name: Restrict PR source branch

on:
  pull_request:
    branches: [master]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR comes from development
        if: github.head_ref != 'development'
        run: |
          echo "PRs to master are only allowed from the 'development' branch."
          echo "This PR is from '${{ github.head_ref }}'."
          exit 1